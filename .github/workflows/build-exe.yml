name: Build Windows EXE

# Solo se construye si el workflow "CI" (Ubuntu + Windows 3.12/3.14) paso
# para ese mismo commit: un .exe nunca sale de un commit con pruebas rotas.
# workflow_dispatch (manual) sigue disponible y no espera al CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # En workflow_run, el commit que probo el CI (no el ultimo de la rama).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      # Sin VLC: PyInstaller no lo necesita (el .exe usa el VLC del equipo
      # del usuario; BUNDLE_VLC=1 en el spec es opcional y local).
      - name: Install build dependencies
        run: pip install -r requirements-build.txt -c constraints.txt

      # Carpeta onedir: dist/ReproductorMultimediaPro/
      - name: Build application folder
        run: pyinstaller --noconfirm ReproductorMultimediaPro.spec

      # Inno Setup 6 viene instalado en windows-latest.
      - name: Build installer
        run: |
          $version = python -c "import player; print(player.__version__)"
          iscc /DAppVersion=$version installer\ReproductorMultimediaPro.iss
        shell: pwsh

      - name: Upload installer and app folder
        uses: actions/upload-artifact@v7
        with:
          name: ReproductorMultimediaPro-windows
          path: |
            dist/installer/*.exe
            dist/ReproductorMultimediaPro/
          retention-days: 30
