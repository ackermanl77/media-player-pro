name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      # PyInstaller no ejecuta `import vlc` durante el analisis de
      # dependencias en la mayoria de los casos, pero instalar VLC aqui
      # evita cualquier sorpresa si algun hook llegara a necesitarlo, y deja
      # el runner en el mismo estado que una maquina de desarrollo real.
      - name: Install VLC
        run: |
          winget install --id VideoLAN.VLC -e --silent --accept-package-agreements --accept-source-agreements
        shell: pwsh

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller ReproductorMultimediaPro.spec

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReproductorMultimediaPro-windows
          path: dist/ReproductorMultimediaPro.exe
          retention-days: 30
