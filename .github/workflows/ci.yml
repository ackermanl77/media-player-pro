name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # VLC (libvlc) y las librerias minimas de Qt son necesarias para que
      # tests/test_app_smoke.py pueda importar `vlc` y construir una
      # QApplication con la plataforma "offscreen". xvfb da un display X
      # real (virtual) para que la seleccion automatica de video de VLC
      # tenga algo a donde salir (tests/test_visualizer.py, test_backend.py).
      # vlc-plugin-visualization trae el filtro "visual" (espectro de audio)
      # que usa el visualizador: es una dependencia Recommends de vlc, y
      # muchas imagenes de CI (incluida esta) traen APT::Install-Recommends
      # en 0, asi que hay que pedirla explicitamente.
      - name: Install system dependencies (VLC + Qt runtime headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc vlc-plugin-visualization libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q player run.py

      - name: Run tests
        run: xvfb-run --auto-servernum python -m pytest -q
