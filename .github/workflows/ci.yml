name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # VLC (libvlc) y las librerias minimas de Qt son necesarias para que
      # tests/test_app_smoke.py pueda importar `vlc` y construir una
      # QApplication con la plataforma "offscreen" (este runner no tiene
      # pantalla real).
      - name: Install system dependencies (VLC + Qt runtime headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q player run.py

      - name: Run tests
        run: python -m pytest -q
