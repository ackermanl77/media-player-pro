name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # VLC (libvlc) y las librerias minimas de Qt son necesarias para que
      # tests/test_app_smoke.py pueda importar `vlc` y construir una
      # QApplication con la plataforma "offscreen". xvfb da un display X real
      # (virtual) para que tests/test_visualizer.py y test_backend.py puedan
      # dejar que VLC autoseleccione un modulo de video real -- los nombres
      # de modulo "vdummy"/"adummy" no se resuelven igual en el VLC de los
      # repos de Ubuntu que en Windows.
      # vlc-plugin-visualization trae el filtro "visual" (espectro de audio)
      # que usa el visualizador: es una dependencia Recommends de vlc, y
      # muchas imagenes de CI (incluida esta) traen APT::Install-Recommends
      # en 0, asi que hay que pedirla explicitamente.
      - name: Install system dependencies (VLC + Qt runtime headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc vlc-plugin-visualization libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q player run.py

      - name: DEBUG visualizer probe
        run: |
          cat > /tmp/probe.py << 'PYEOF'
import time
import wave
import vlc

wav_path = "/tmp/tone.wav"
with wave.open(wav_path, "w") as f:
    f.setnchannels(1)
    f.setsampwidth(2)
    f.setframerate(8000)
    f.writeframes(b"\x00\x01" * 8000)

inst = vlc.Instance(["--audio-visual=visual", "--effect-list=spectrum", "-vvv"])
mp = inst.media_player_new()
media = inst.media_new_path(wav_path)
mp.set_media(media)
mp.play()
for i in range(20):
    time.sleep(0.3)
    print(f"t={i*0.3:.1f} state={mp.get_state()} has_vout={mp.has_vout()}", flush=True)
mp.stop()
PYEOF
          xvfb-run --auto-servernum python /tmp/probe.py 2>&1 | grep -v "ALSA lib\|snd_" | tail -100

      - name: Run tests
        run: xvfb-run --auto-servernum python -m pytest -q
