[project]
name = "media-player-pro"
# Version unica en player/__init__.py (__version__): la leen setuptools, el
# recurso de version del .exe (packaging/version_resource.py), el instalador
# y el workflow de release.
dynamic = ["version"]
description = "Reproductor de musica y video de alta calidad basado en libVLC y PySide6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-vlc>=3.0.20123",
    "PySide6>=6.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Solo el paquete "player" (installer/ y packaging/ son del build de Windows).
[tool.setuptools]
packages = ["player"]

[tool.setuptools.package-data]
player = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "player.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
